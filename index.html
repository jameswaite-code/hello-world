<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #000;
    color: #fff;
    font-family: system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  h1 { font-weight: normal; font-size: 1.5rem; margin: 0 1rem; }
  .name { display: block; font-size: clamp(3rem, 12vw, 9rem); font-weight: bold; line-height: 1.1; }
</style>
</head>
<body>
<h1>Hello, my name is <span class="name">James Waite</span></h1>
</body>
</html>
