<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #000;
    color: #fff;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 1rem;
    overflow: hidden;
  }
  h1 { font-weight: normal; font-size: 1.25rem; margin: 0; opacity: .85; }
  .stage {
    --toast: min(68vw, 74vh, 640px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 2vmin;
  }
  #toast {
    display: block;
    touch-action: none;
    width: var(--toast);
    height: var(--toast);
  }
  #pot {
    width: calc(var(--toast) * .3);
    margin-bottom: calc(var(--toast) * .04);
    padding: 0;
    border: 0;
    background: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  #jar { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; touch-action: none; transition: transform .15s ease, filter .4s ease; }
  #pot.dipping #jar { transform: translateY(4px) scale(.97); }
  #pot.dry #jar { animation: nudge 1.6s ease-in-out infinite; filter: drop-shadow(0 0 14px rgba(255, 196, 70, .55)); }
  #pot:focus-visible { outline: 2px solid #f2c230; outline-offset: 4px; border-radius: 8px; }
  @keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @media (max-width: 640px) {
    .stage { --toast: min(92vw, 60vh); flex-direction: column; align-items: center; gap: .5rem; }
    #pot { width: 110px; margin: 0; }
  }
  p { margin: 0; font-size: .85rem; opacity: .45; padding: 0 1rem; }
  .fallback { font-size: clamp(3rem, 12vw, 9rem); font-weight: bold; }
</style>
</head>
<body>
<h1>Hello, my name is…</h1>
<div class="stage">
<canvas id="toast" aria-label="A slice of toast. Drag across it to spread Marmite and reveal the name James Waite."></canvas>
<button id="pot" type="button" aria-label="Jar of Marmite: dip your knife here for more">
  <canvas id="jar"></canvas>
</button>
</div>
<p id="hint">Drag to spread the Marmite · dip your knife in the jar for more · double-click for a fresh slice</p>

<script>
(() => {
  const NAME = ['James', 'Waite'];
  const TEX = 1024;

  const canvas = document.getElementById('toast');
  const gl = canvas.getContext('webgl', { antialias: false, alpha: true, premultipliedAlpha: true });
  if (!gl) {
    const h = document.createElement('div');
    h.className = 'fallback';
    h.textContent = NAME.join(' ');
    canvas.replaceWith(h);
    return;
  }

  const pot = document.getElementById('pot');

  // Butter-knife cursor (128px, the largest browsers allow): steel blade, bolster, riveted wooden
  // handle; the blade carries more or less Marmite depending on what's left. Tip is the hotspot.
  function knifeCursor(level) {
    const marmite = level === 0 ? '' : level === 1
      ? `<path d='M58 -8 C60 -16 68 -17 70 -9 C71 0 69 8 70 16 C68 20 66 13 64 18 C62 23 60 14 58 19 Z' fill='url(#mm)' opacity='.85'/>
         <path d='M61 -8 C61 0 61 6 62 12' stroke='#fff' stroke-opacity='.35' stroke-width='1.2' fill='none' stroke-linecap='round'/>`
      : `<path d='M57 -10 C58 -19 70 -20 71 -10 L71.5 28 C70 35 67 29 65 36 C63 42 61 33 59 38 C57.5 34 57 30 57 26 Z' fill='url(#mm)'/>
         <path d='M60.5 -10 C60 4 60.5 16 61.5 28' stroke='#fff' stroke-opacity='.45' stroke-width='1.6' fill='none' stroke-linecap='round'/>
         <ellipse cx='66' cy='-6' rx='2' ry='3.5' fill='#fff' opacity='.35'/>`;
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='128' height='128' viewBox='0 0 128 128'>
      <defs>
        <linearGradient id='steel' x1='0' x2='1'>
          <stop offset='0' stop-color='#5f666e'/><stop offset='.28' stop-color='#eef1f4'/>
          <stop offset='.45' stop-color='#b4bac1'/><stop offset='.7' stop-color='#dfe3e7'/><stop offset='1' stop-color='#6b727a'/>
        </linearGradient>
        <linearGradient id='bolster' x1='0' x2='1'>
          <stop offset='0' stop-color='#4a5057'/><stop offset='.35' stop-color='#d9dde1'/><stop offset='1' stop-color='#50565d'/>
        </linearGradient>
        <linearGradient id='wood' x1='0' x2='1'>
          <stop offset='0' stop-color='#2a160a'/><stop offset='.3' stop-color='#7a4a26'/>
          <stop offset='.55' stop-color='#5c351a'/><stop offset='1' stop-color='#22120a'/>
        </linearGradient>
        <radialGradient id='rivet' cx='.35' cy='.35' r='.7'>
          <stop offset='0' stop-color='#fff4c8'/><stop offset='.5' stop-color='#c79a3a'/><stop offset='1' stop-color='#6b4a12'/>
        </radialGradient>
        <linearGradient id='mm' x1='0' x2='1'>
          <stop offset='0' stop-color='#2a1206'/><stop offset='.4' stop-color='#1a0903'/><stop offset='1' stop-color='#0c0401'/>
        </linearGradient>
        <filter id='sh' x='-30%' y='-30%' width='160%' height='160%'>
          <feDropShadow dx='3' dy='5' stdDeviation='3' flood-color='#000' flood-opacity='.55'/>
        </filter>
      </defs>
      <g transform='rotate(-45 64 64)' filter='url(#sh)'>
        <path d='M56 62 L56 -8 C56 -17 60 -21 64 -21 C68.5 -21 72 -17 72 -9 L72 62 Z' fill='url(#steel)' stroke='#4b5158' stroke-width='.8'/>
        <path d='M57.6 -6 C57.6 -14 60 -18.5 63 -19.4' stroke='#fff' stroke-opacity='.8' stroke-width='1' fill='none' stroke-linecap='round'/>
        <path d='M70.5 60 L70.5 -8' stroke='#3c4248' stroke-opacity='.5' stroke-width='1'/>
        ${marmite}
        <rect x='54.5' y='61' width='19' height='9' rx='2' fill='url(#bolster)' stroke='#3a3f45' stroke-width='.6'/>
        <rect x='53.5' y='69' width='21' height='80' rx='7' fill='url(#wood)' stroke='#1a0d05' stroke-width='.8'/>
        <path d='M58 74 C59 95 57 118 59 144 M63 72 C64 100 62 120 64 146 M69 74 C68 98 70 122 68 144' stroke='#1f1007' stroke-opacity='.45' stroke-width='.8' fill='none'/>
        <path d='M57 73 L57 145' stroke='#c08a5a' stroke-opacity='.35' stroke-width='1.4' stroke-linecap='round'/>
        <circle cx='64' cy='88' r='2.6' fill='url(#rivet)'/><circle cx='64' cy='128' r='2.6' fill='url(#rivet)'/>
      </g>
    </svg>`;
    return `url("data:image/svg+xml,${encodeURIComponent(svg)}") 6 6, crosshair`;
  }
  const CURSORS = [0, 1, 2].map(knifeCursor);
  let cursorLevel = -1;
  function setCursor(level) {
    if (level === cursorLevel) return;
    cursorLevel = level;
    canvas.style.cursor = pot.style.cursor = CURSORS[level];
  }

  // Marmite paint mask: alpha = amount spread, RG = knife direction (doubled angle)
  const mask = document.createElement('canvas');
  mask.width = mask.height = TEX;
  const mctx = mask.getContext('2d', { willReadFrequently: true });

  // Smear mask: once the whole name is revealed, further spreading melts it into an even layer
  const smear = document.createElement('canvas');
  smear.width = smear.height = TEX;
  const sctx = smear.getContext('2d');

  // Name mask, pre-blurred so the shader can shape rounded, gloopy letters
  const text = document.createElement('canvas');
  text.width = text.height = TEX;
  const tctx = text.getContext('2d');

  function drawText() {
    tctx.clearRect(0, 0, TEX, TEX);
    const family = '"Fredoka", "Arial Rounded MT Bold", "Helvetica Neue", Arial, sans-serif';
    let size = 260;
    tctx.font = `700 ${size}px ${family}`;
    const widest = Math.max(...NAME.map(l => tctx.measureText(l).width));
    size = Math.min(size, size * (TEX * 0.6) / widest);
    tctx.font = `700 ${size}px ${family}`;
    tctx.textAlign = 'center';
    tctx.textBaseline = 'middle';
    // Draw off-canvas and keep only the shadow: a cross-browser blur
    tctx.shadowColor = '#fff';
    tctx.shadowBlur = 15;
    tctx.shadowOffsetX = TEX * 2;
    tctx.fillStyle = '#fff';
    const ys = [0.41, 0.66];
    NAME.forEach((line, i) => tctx.fillText(line, TEX / 2 - TEX * 2, TEX * ys[i]));
    buildLetterPoints(tctx.font, size, ys);
  }

  // Sample points inside each letter, used to tell when every letter has been fully revealed
  let letters = [], lettersRect = null;
  function buildLetterPoints(font, size, ys) {
    const g = document.createElement('canvas');
    g.width = g.height = TEX;
    const gc = g.getContext('2d', { willReadFrequently: true });
    gc.font = font;
    gc.textAlign = 'left';
    gc.textBaseline = 'middle';
    letters = [];
    let minX = TEX, minY = TEX, maxX = 0, maxY = 0;
    NAME.forEach((line, li) => {
      const x0 = TEX / 2 - gc.measureText(line).width / 2;
      const y = TEX * ys[li];
      for (let i = 0; i < line.length; i++) {
        const x = x0 + gc.measureText(line.slice(0, i)).width;
        gc.clearRect(0, 0, TEX, TEX);
        gc.fillText(line[i], x, y);
        const bx = Math.max(0, Math.floor(x - size * .1));
        const by = Math.max(0, Math.floor(y - size * .7));
        const bw = Math.min(TEX - bx, Math.ceil(gc.measureText(line[i]).width + size * .2));
        const bh = Math.min(TEX - by, Math.ceil(size * 1.4));
        const img = gc.getImageData(bx, by, bw, bh).data;
        const pts = [];
        for (let py = 0; py < bh; py += 5) for (let px = 0; px < bw; px += 5) {
          if (img[(py * bw + px) * 4 + 3] > 200) pts.push([bx + px, by + py]);
        }
        if (!pts.length) continue;
        letters.push(pts);
        minX = Math.min(minX, bx); minY = Math.min(minY, by);
        maxX = Math.max(maxX, bx + bw); maxY = Math.max(maxY, by + bh);
      }
    });
    lettersRect = { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
  }

  const vs = `
    attribute vec2 a;
    varying vec2 vUv;
    void main() { vUv = vec2(a.x * .5 + .5, .5 - a.y * .5); gl_Position = vec4(a, 0., 1.); }`;

  const fs = `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uMask, uText, uSmear;
    uniform float uRes;

    float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
    vec2 hash22(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
    float vnoise(vec2 p) {
      vec2 i = floor(p), f = fract(p), u = f * f * (3. - 2. * f);
      return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y);
    }
    float fbm(vec2 p) { float s = 0., a = .5; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= .5; } return s; }
    vec2 worley(vec2 p) {
      vec2 i = floor(p), f = fract(p); float d1 = 8., d2 = 8.;
      for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
        vec2 g = vec2(float(x), float(y)); vec2 r = g + hash22(i + g) - f; float d = dot(r, r);
        if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) d2 = d;
      }
      return sqrt(vec2(d1, d2));
    }

    float sdCircle(vec2 p, vec2 c, float r) { return length(p - c) - r; }
    float sdRoundBox(vec2 p, vec2 b, float r) { vec2 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }
    float smin(float a, float b, float k) { float h = clamp(.5 + .5 * (b - a) / k, 0., 1.); return mix(b, a, h) - k * h * (1. - h); }

    // Bread-slice silhouette: square body with a domed, slightly overhanging top
    float sliceSDF(vec2 p) {
      float body = sdRoundBox(p - vec2(0., .12), vec2(.76, .72), .14);
      float l = sdCircle(p, vec2(-.40, -.50), .42);
      float r = sdCircle(p, vec2(.40, -.50), .42);
      float m = sdCircle(p, vec2(0., -.36), .50);
      float d = smin(smin(l, r, .08), m, .1);
      d = smin(d, body, .12);
      return d + (fbm(p * 2.2 + 3.) - .5) * .045;
    }

    // Crumb relief: large and small air pockets plus fine grain
    // Irregular pores of varying size, sunk into a grainy toasted surface (1 = surface, 0 = deep pore)
    float toastHeight(vec2 p) {
      vec2 wp = p + (vec2(fbm(p * 3.), fbm(p * 3. + 11.)) - .5) * .25;
      vec2 w1 = worley(wp * vec2(13., 16.));
      vec2 w2 = worley(wp * vec2(29., 34.) + 5.);
      float r1 = .12 + .4 * vnoise(p * 7.);
      float r2 = .08 + .35 * vnoise(p * 13. + 4.);
      float rough = (vnoise(p * 110.) - .5) * .14;
      float pore1 = smoothstep(r1, r1 * .35, w1.x + rough);
      float pore2 = smoothstep(r2, r2 * .3, w2.x + rough);
      float grain = fbm(p * 45.) * .6 + vnoise(p * 140.) * .4;
      return clamp(1. - pore1 * .75 - pore2 * .5, 0., 1.) * (.62 + .38 * grain);
    }

    vec3 toastRamp(float t) {
      vec3 c0 = vec3(.94, .82, .60), c1 = vec3(.82, .55, .26), c2 = vec3(.50, .27, .10), c3 = vec3(.20, .10, .04);
      if (t < 1.) return mix(c0, c1, clamp(t, 0., 1.));
      if (t < 2.) return mix(c1, c2, t - 1.);
      return mix(c2, c3, clamp(t - 2., 0., 1.));
    }

    // x: surface height, y: marmite thickness, z: crumb height, w: slice SDF
    vec4 surf(vec2 uv, out float thick) {
      vec2 p = (uv - .5) * 2.;
      float d = sliceSDF(p);
      float th = toastHeight(p);
      float crustRidge = smoothstep(0., -.03, d) * smoothstep(-.13, -.04, d);

      // Small blur of the 8-bit mask so its quantisation steps don't show up as ridges
      vec2 o = vec2(1.5 / 1024., 0.);
      vec4 m = (texture2D(uMask, uv) * 2. + texture2D(uMask, uv + o) + texture2D(uMask, uv - o)
              + texture2D(uMask, uv + o.yx) + texture2D(uMask, uv - o.yx)) / 6.;
      float paint = m.a;
      // Knife direction is noisy per texel, so average it (weighted by paint) over a wider area
      vec2 w = vec2(6. / 1024., 0.);
      vec4 d0 = texture2D(uMask, uv), d1 = texture2D(uMask, uv + w), d2 = texture2D(uMask, uv - w),
           d3 = texture2D(uMask, uv + w.yx), d4 = texture2D(uMask, uv - w.yx);
      vec2 c2 = (d0.rg * 2. - 1.) * d0.a + (d1.rg * 2. - 1.) * d1.a + (d2.rg * 2. - 1.) * d2.a
              + (d3.rg * 2. - 1.) * d3.a + (d4.rg * 2. - 1.) * d4.a;
      float ang = atan(c2.y, c2.x + 1e-5) * .5;
      vec2 dir = vec2(cos(ang), sin(ang));

      float n = vnoise(uv * 38.);
      float cover = smoothstep(.03 + .1 * n, .2 + .1 * n, paint);
      // Warp the letters so their edges wander like something melting
      vec2 warp = (vec2(fbm(uv * 7.), fbm(uv * 7. + 13.)) - .5) * .022
                + (vec2(vnoise(uv * 30.), vnoise(uv * 30. + 9.3)) - .5) * .006;
      // Smear (after the name is fully revealed): drags the letters along the knife and dissolves them
      float sm = (texture2D(uSmear, uv) * 2. + texture2D(uSmear, uv + o) + texture2D(uSmear, uv - o)
               + texture2D(uSmear, uv + o.yx) + texture2D(uSmear, uv - o.yx)).a / 6.;
      vec2 sd = dir * sm * .016;
      float t = texture2D(uText, uv + warp).a;
      float tS = (t + texture2D(uText, uv + warp + sd).a + texture2D(uText, uv + warp - sd).a
                 + texture2D(uText, uv + warp + sd * 2.).a + texture2D(uText, uv + warp - sd * 2.).a) / 5.;
      t = mix(t, tS, smoothstep(0., .5, sm));
      float fade = smoothstep(.05, .95, sm);
      float letter = smoothstep(.12, .75, t) * (1. - fade);
      float halo = smoothstep(.02, .35, t) * (1. - fade); // Marmite bleeding out into the butter

      // Knife streaks run along the direction of the stroke
      vec2 q = vec2(dot(uv, dir), dot(uv, vec2(-dir.y, dir.x)));
      float streak = vnoise(vec2(q.x * 6., q.y * 70.)) * .55 + vnoise(vec2(q.x * 3., q.y * 24.)) * .45;

      // Streaks of butter swirled through the Marmite
      float marble = smoothstep(.2, .8, vnoise(vec2(q.x * 5., q.y * 26.) + fbm(uv * 12.) * 2.));

      // Even, everyday layer of Marmite wherever it has been spread out
      float even = smoothstep(.02 + .1 * n, .4 + .1 * n, sm);

      thick = letter * cover;
      float film = paint * (.35 + .65 * streak);
      float thickness = thick * (.17 + .32 * marble) + halo * cover * .08 + film * .19
                      + even * (.2 + .18 * streak) * (.8 + .4 * marble);
      float H = th * .0016 * (1. - thick * .55 - even * .3) + crustRidge * .004
              + thick * .0022 * (.7 + .3 * marble) + film * .0002 + even * .0012 * (.6 + .4 * streak);
      return vec4(H, thickness, th, d);
    }

    void main() {
      vec2 uv = vUv;
      float px = 2. / uRes;
      float d0 = sliceSDF((uv - .5) * 2.);
      float inside = smoothstep(px * 1.5, -px * 1.5, d0);
      if (inside <= 0.) { gl_FragColor = vec4(0.); return; }

      // Normal step spans ~2 mask texels so bilinear texel edges don't show in the gloss
      float e = max(1. / uRes, 2. / 1024.), thick, tx, ty;
      vec4 s = surf(uv, thick);
      vec4 sx = surf(uv + vec2(e, 0.), tx);
      vec4 sy = surf(uv + vec2(0., e), ty);
      vec3 N = normalize(vec3(-(sx.x - s.x) / e, -(sy.x - s.x) / e, 1.));
      vec3 L = normalize(vec3(-.5, -.62, .75));
      vec3 V = vec3(0., 0., 1.);
      vec2 p = (uv - .5) * 2.;
      float d = s.w, th = s.z;

      // Toast
      float interior = smoothstep(-.015, -.1, d);
      float edgeDark = smoothstep(-.45, -.06, d);
      float patchy = fbm(p * 2.5 + 5.);
      float bands = sin(p.y * 8. + fbm(p * 1.4) * 3.5) * .5 + .5;
      float spots = smoothstep(.55, .8, fbm(p * 6. + 21.));
      float lvl = .35 + patchy * .8 + edgeDark * .55 + (th - .7) * 1.1 + bands * .12 + spots * .35;
      vec3 alb = toastRamp(lvl);
      // Pore interiors: paler, less toasted crumb sitting in shadow
      alb = mix(toastRamp(lvl + .5) * vec3(.6, .5, .4), alb, smoothstep(.1, .55, th));
      alb *= .85 + .3 * vnoise(p * 90.); // fine crumb speckle
      vec3 crustCol = mix(vec3(.38, .19, .07), vec3(.20, .10, .045), fbm(p * 22.));
      alb = mix(crustCol, alb, interior);

      // Melted butter: soaks in patchily, darkening and yellowing the crumb, and pools in the holes
      float butter = interior * smoothstep(.25, .7, fbm(p * 2.6 + 40.));
      float pool = butter * smoothstep(.5, .15, th);
      alb = mix(alb, alb * vec3(1.02, .9, .6), butter * .55);

      float diff = max(dot(N, L), 0.);
      vec3 col = alb * (.38 + .75 * diff);
      vec3 Hh = normalize(L + V);
      float ndh = max(dot(N, Hh), 0.);
      col += vec3(1., .9, .75) * pow(ndh, 30.) * .05 * (1. - interior);
      col += vec3(1., .9, .62) * (pow(ndh, 60.) * .9 + pow(ndh, 12.) * .06) * (butter * .35 + pool * .9);

      // Marmite casts a faint shadow onto the toast beside it
      vec2 so = uv + normalize(L.xy) * .006;
      float occ = smoothstep(.12, .75, texture2D(uText, so).a) * smoothstep(.03, .2, texture2D(uMask, so).a);
      occ *= 1. - texture2D(uSmear, so).a;
      col *= 1. - clamp(occ - thick, 0., 1.) * .15;

      // Marmite: Beer-Lambert absorption, a translucent amber-brown the toast shows through, + wet gloss
      float k = s.y;
      vec3 marm = col * exp(-vec3(2.2, 4.3, 7.8) * k * 1.25)
                + vec3(.05, .018, .006) * smoothstep(0., .5, k) * (.6 + .6 * diff);
      float wet = smoothstep(0., .06, k);
      float spec = pow(ndh, 180.) * 1.6 + pow(ndh, 22.) * .14;
      vec3 R = reflect(-V, N);
      float box = smoothstep(.26, .16, abs(R.x + .26)) * smoothstep(.3, .18, abs(R.y + .32));
      float box2 = smoothstep(.1, .05, abs(R.x - .42)) * smoothstep(.4, .28, abs(R.y + .05)) * .4;
      float fres = .04 + .96 * pow(1. - max(N.z, 0.), 5.);
      // Soft room reflection so flat, wet tops still read as glossy
      float env = .06 + .1 * smoothstep(.3, -.4, R.y) + .5 * fres;
      col = marm + vec3(1., .95, .88) * wet * (spec + env * .35 + (box + box2) * (.35 + 2.2 * fres));

      col *= mix(.55, 1., smoothstep(0., -.025, d));
      gl_FragColor = vec4(col * inside, inside);
    }`;

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const aLoc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(aLoc);
  gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

  function makeTex(unit, name) {
    const t = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.uniform1i(gl.getUniformLocation(prog, name), unit);
    return t;
  }
  const maskTex = makeTex(0, 'uMask');
  const textTex = makeTex(1, 'uText');
  const smearTex = makeTex(2, 'uSmear');
  const uRes = gl.getUniformLocation(prog, 'uRes');

  function upload(unit, tex, src) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  }

  let dirty = true, maskDirty = true, textDirty = true, smearDirty = true;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const size = Math.round(canvas.clientWidth * dpr);
    if (canvas.width !== size) {
      canvas.width = canvas.height = size;
      gl.viewport(0, 0, size, size);
      gl.uniform1f(uRes, size);
      dirty = true;
    }
  }

  function frame() {
    resize();
    drawJar();
    if (dirty) {
      if (maskDirty) { upload(0, maskTex, mask); maskDirty = false; }
      if (textDirty) { upload(1, textTex, text); textDirty = false; }
      if (smearDirty) { upload(2, smearTex, smear); smearDirty = false; }
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      dirty = false;
    }
    requestAnimationFrame(frame);
  }

  // Jar of Marmite: a lathe-profile glass jar, lit by the same key light as the toast
  const jarCanvas = document.getElementById('jar');
  const jgl = jarCanvas.getContext('webgl', { antialias: false, alpha: true, premultipliedAlpha: true });
  const jarFs = `
    precision highp float;
    varying vec2 vUv;
    uniform vec2 uRes;

    const vec3 L = vec3(-.5, -.62, .75) / 1.094;
    const vec3 V = vec3(0., 0., 1.);
    const vec3 NP = vec3(0., -.947, .32); // a horizontal surface, seen from slightly above
    const vec3 DEPTH = vec3(0., .32, .947);

    float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
    float vnoise(vec2 p) {
      vec2 i = floor(p), f = fract(p), u = f * f * (3. - 2. * f);
      return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y);
    }
    float box(vec2 q, vec2 c, vec2 h, float s) { vec2 d = abs(q - c) - h; return 1. - smoothstep(-s, s, max(d.x, d.y)); }

    // Studio: big softbox top-left (matches the toast's light), warm strip light right, dim ceiling
    vec3 env(vec3 r) {
      vec3 e = vec3(.012, .01, .008);
      e += vec3(1., .97, .92) * 9. * box(r.xy, vec2(-.6, -.2), vec2(.12, .75), .05);
      e += vec3(1., .8, .55) * 4. * box(r.xy, vec2(.7, 0.), vec2(.045, .7), .03);
      e += vec3(.9, .92, 1.) * .7 * smoothstep(-.5, -.95, r.y);
      return e;
    }
    float fresnel(vec3 n, float f0) { return f0 + (1. - f0) * pow(1. - max(n.z, 0.), 5.); }

    // Squat, pot-bellied profile: short wide neck, round belly, narrower rounded base
    const float Y_TOP = .3, Y_BOT = 1.14;
    float radius(float y) {
      float t = clamp((y - Y_TOP) / (Y_BOT - Y_TOP), 0., 1.);
      float dome = pow(sin(3.14159 * clamp((t - .08) / .92, 0., 1.)), .6);
      float r = mix(mix(.265, .27, smoothstep(.3, .75, t)), .39, dome);
      float k = max(0., y - (Y_BOT - .035)); // rounded base
      return r - (.035 - sqrt(max(0., .035 * .035 - k * k)));
    }

    vec4 over(vec4 top, vec4 under) { return top + under * (1. - top.a); }

    vec3 shadeGlass(vec2 p, float r) {
      float xn = clamp(p.x / max(r, 1e-3), -1., 1.), zn = sqrt(max(0., 1. - xn * xn));
      float dR = (radius(p.y + .002) - radius(p.y - .002)) / .004;
      float thread = (p.y > .308 && p.y < .36) ? sin(p.y * 280.) * .35 : 0.; // screw thread on the neck
      vec3 N = normalize(vec3(xn, -dR + thread, zn));
      float F = fresnel(N, .04);
      float edge = pow(1. - zn, 2.5);
      vec3 inside = vec3(.028, .011, .004);
      vec3 trans = vec3(.55, .2, .05) * edge * .55                                   // light through thin glass at the edges
                 + vec3(.4, .14, .03) * smoothstep(1.05, 1.12, p.y) * .35 * (.5 + .5 * zn) // thick glass base
                 + vec3(.35, .12, .03) * .16 * max(dot(N, L), 0.) * (1. - edge);
      float spec = pow(max(dot(N, normalize(L + V)), 0.), 350.) * 6.;
      float ao = mix(.55, 1., smoothstep(Y_BOT, Y_BOT - .08, p.y));
      return ((inside + trans) * (1. - F) + env(reflect(-V, N)) * F) * ao + spec;
    }

    void main() {
      float asp = uRes.y / uRes.x;
      vec2 p = vec2(vUv.x - .44, vUv.y * asp);
      float px = 1. / uRes.x;
      vec4 acc = vec4(0.);

      // Body
      float r = radius(p.y);
      float a = clamp((r - abs(p.x)) / px + .5, 0., 1.) * clamp((p.y - Y_TOP) / px + .5, 0., 1.) * clamp((Y_BOT - p.y) / px + .5, 0., 1.);
      if (a > 0.) acc = vec4(shadeGlass(p, r), 1.) * a;

      // Drip of Marmite running down from the rim
      {
        float dx = p.x - (.17 + .004 * sin(p.y * 40.));
        vec2 bc = vec2(.17 + .004 * sin(.47 * 40.), .47);
        float w = .017 * (1. - .25 * smoothstep(.3, .46, p.y));
        float stem = max(abs(dx) - w, max(Y_TOP - p.y, p.y - bc.y));
        float bulb = length(p - bc) - .022;
        float d = min(stem, bulb);
        float da = clamp(-d / px + .5, 0., 1.);
        if (da > 0.) {
          vec2 g = bulb < stem ? (p - bc) / .022 : vec2(dx / w, -.15);
          vec3 N = normalize(vec3(g, sqrt(max(0., 1. - dot(g, g))) + .08));
          vec3 c = vec3(.03, .011, .003) * (.4 + .6 * max(dot(N, L), 0.))
                 + env(reflect(-V, N)) * fresnel(N, .05) + pow(max(dot(N, normalize(L + V)), 0.), 200.) * 3.;
          acc = over(vec4(c, 1.) * da, acc);
        }
      }

      // Rim of the open neck, and the Marmite inside
      {
        float rOut = .268, rIn = .228, ry = .32;
        vec2 q = vec2(p.x, (p.y - Y_TOP) / ry);
        float e = length(q);
        float ta = clamp((rOut - e) * ry / px + .5, 0., 1.);
        if (ta > 0.) {
          vec3 c;
          if (e < rIn) {
            // Glossy Marmite surface with a swirl left by a knife
            vec2 s = q / rIn;
            float ang = atan(s.y, s.x), rad = length(s);
            // Smooth peaks and troughs where the knife has swirled it; mostly a dark mirror
            float swirl = sin(ang * 2. + rad * 7. + vnoise(s * 2.5) * 1.5);
            vec3 radialV = vec3(cos(ang), 0., 0.) + DEPTH * sin(ang);
            vec3 N = normalize(NP + radialV * swirl * .35 * smoothstep(.1, .8, rad)
                                  + vec3(-.35, 0., 0.) * smoothstep(.2, 1., rad) * (s.x < 0. ? 1. : -.4));
            float F = fresnel(N, .05);
            c = vec3(.028, .011, .004) * (1. - F) + env(reflect(-V, N)) * F * vec3(1., .82, .66)
              + pow(max(dot(N, normalize(L + V)), 0.), 160.) * 2.5 * vec3(1., .92, .8);
            c *= mix(.45, 1., smoothstep(rIn, rIn * .75, e)); // shadowed where it meets the glass
          } else {
            // Rounded glass lip
            float sLip = (e - rIn) / (rOut - rIn);
            vec2 dir = q / max(e, 1e-4);
            float t = (sLip - .5) * 2.4;
            vec3 radial = vec3(dir.x, 0., 0.) + DEPTH * dir.y;
            vec3 N = normalize(cos(t) * NP + sin(t) * radial);
            float F = fresnel(N, .04);
            c = vec3(.5, .2, .06) * .22 * (1. - F) + env(reflect(-V, N)) * F
              + pow(max(dot(N, normalize(L + V)), 0.), 300.) * 5.;
          }
          acc = over(vec4(c, 1.) * ta, acc);
        }
      }

      // Yellow screw lid resting on the table in front
      {
        vec2 lc = vec2(.31, 1.15);
        float lr = .23, lh = .085, lry = lr * .32;
        float yT = lc.y - lh;
        float xl = (p.x - lc.x) / lr;
        vec3 albedo = vec3(.98, .72, .09);
        if (abs(xl) < 1.02) {
          float zl = sqrt(max(0., 1. - xl * xl));
          // Knurled side
          float side = clamp((lr - abs(p.x - lc.x)) / px + .5, 0., 1.)
                     * clamp((p.y - yT) / px + .5, 0., 1.)
                     * clamp((lc.y + lry * zl - p.y) / px + .5, 0., 1.);
          if (side > 0.) {
            float kn = sin(asin(clamp(xl, -1., 1.)) * 90.);
            vec3 N = normalize(vec3(xl + .2 * kn * zl, .06, zl - .2 * kn * xl));
            float F = fresnel(N, .04);
            float ao = mix(.5, 1., smoothstep(lc.y + lry * zl, lc.y + lry * zl - .02, p.y));
            vec3 c = albedo * (.14 + .85 * max(dot(N, L), 0.)) * ao * (1. - F)
                   + env(reflect(-V, N)) * F * .8 + pow(max(dot(N, normalize(L + V)), 0.), 60.) * .45;
            acc = over(vec4(c, 1.) * side, acc);
          }
          // Top face, with a bevelled edge
          vec2 q = vec2(p.x - lc.x, (p.y - yT) / .32);
          float e = length(q);
          float ta = clamp((lr - e) * .32 / px + .5, 0., 1.);
          if (ta > 0.) {
            vec2 dir = q / max(e, 1e-4);
            float bevel = smoothstep(lr * .86, lr, e);
            vec3 N = normalize(NP + (vec3(dir.x, 0., 0.) + DEPTH * dir.y) * bevel * 1.1
                               + vec3(vnoise(q * 90.) - .5, 0., 0.) * .04);
            float F = fresnel(N, .04);
            vec3 c = albedo * (.14 + .85 * max(dot(N, L), 0.)) * (1. - F)
                   + env(reflect(-V, N)) * F * .8 + pow(max(dot(N, normalize(L + V)), 0.), 60.) * .45;
            acc = over(vec4(c, 1.) * ta, acc);
          }
        }
      }

      gl_FragColor = acc;
    }`;

  function makeProgram(ctx, vsSrc, fsSrc) {
    const p = ctx.createProgram();
    for (const [type, src] of [[ctx.VERTEX_SHADER, vsSrc], [ctx.FRAGMENT_SHADER, fsSrc]]) {
      const sh = ctx.createShader(type);
      ctx.shaderSource(sh, src);
      ctx.compileShader(sh);
      if (!ctx.getShaderParameter(sh, ctx.COMPILE_STATUS)) throw new Error(ctx.getShaderInfoLog(sh));
      ctx.attachShader(p, sh);
    }
    ctx.linkProgram(p);
    return p;
  }

  let drawJar = () => {};
  if (jgl) {
    const jp = makeProgram(jgl, vs, jarFs);
    jgl.useProgram(jp);
    jgl.bindBuffer(jgl.ARRAY_BUFFER, jgl.createBuffer());
    jgl.bufferData(jgl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), jgl.STATIC_DRAW);
    const ja = jgl.getAttribLocation(jp, 'a');
    jgl.enableVertexAttribArray(ja);
    jgl.vertexAttribPointer(ja, 2, jgl.FLOAT, false, 0, 0);
    const jRes = jgl.getUniformLocation(jp, 'uRes');
    drawJar = () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.round(jarCanvas.clientWidth * dpr), h = Math.round(w * 1.25);
      if (!w || (jarCanvas.width === w && jarCanvas.height === h)) return;
      jarCanvas.width = w;
      jarCanvas.height = h;
      jgl.viewport(0, 0, w, h);
      jgl.uniform2f(jRes, w, h);
      jgl.clearColor(0, 0, 0, 0);
      jgl.clear(jgl.COLOR_BUFFER_BIT);
      jgl.drawArrays(jgl.TRIANGLE_STRIP, 0, 4);
    };
  }

  // Spreading
  // The knife holds enough Marmite for roughly 3–4 letters (measured in distance spread over the toast)
  const KNIFE_REACH = 3000;
  let spreading = false, activePointer = null, last = null, supply = 1;

  function updateSupplyUI() {
    const dry = !unlocked && supply <= .02;
    setCursor(unlocked || supply > .45 ? 2 : supply > .02 ? 1 : 0);
    pot.classList.toggle('dry', dry);
  }

  function refill() {
    supply = 1;
    updateSupplyUI();
    pot.classList.add('dipping');
    clearTimeout(refill.t);
    refill.t = setTimeout(() => pot.classList.remove('dipping'), 180);
  }

  function toTex(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * TEX, y: (e.clientY - r.top) / r.height * TEX };
  }

  function stamp(ctx, x, y, dx, dy, amount) {
    const ang = Math.atan2(dy, dx);
    const r = Math.round((Math.cos(2 * ang) * .5 + .5) * 255);
    const g = Math.round((Math.sin(2 * ang) * .5 + .5) * 255);
    const radius = 44 + Math.random() * 6;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.scale(.38, 1); // knife edge is wide across the stroke, narrow along it
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
    grad.addColorStop(0, `rgba(${r},${g},128,${amount * .85})`);
    grad.addColorStop(.65, `rgba(${r},${g},128,${amount})`);
    grad.addColorStop(1, `rgba(${r},${g},128,0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function spreadTo(pt) {
    const dx = pt.x - last.x, dy = pt.y - last.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 1) return;
    const steps = Math.ceil(dist / 3);
    let painted = false;
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      const x = last.x + dx * t, y = last.y + dy * t;
      if (x < 0 || y < 0 || x > TEX || y > TEX) continue; // off the toast (e.g. coming from the jar)
      painted = true;
      if (unlocked) {
        // Mixing the name in never runs out
        stamp(mctx, x, y, dx, dy, .04);
        stamp(sctx, x, y, dx, dy, .03);
      } else {
        // Spreading thins out as the knife runs dry
        const amount = .06 * Math.min(1, supply / .25);
        if (amount > .001) stamp(mctx, x, y, dx, dy, amount);
        supply = Math.max(0, supply - (dist / steps) / KNIFE_REACH);
      }
    }
    last = pt;
    if (!painted) return;
    maskDirty = dirty = true;
    if (unlocked) smearDirty = true;
    else { checkSoon(); updateSupplyUI(); }
  }

  // Reveal progress: a letter counts once nearly all of it is covered well enough to show fully.
  // Mixing the name into the toast unlocks once half the letters are complete.
  let unlocked = false, checkTimer = 0;

  function checkReveal() {
    checkTimer = 0;
    if (unlocked || !lettersRect) return;
    const { x, y, w, h } = lettersRect;
    const data = mctx.getImageData(x, y, w, h).data;
    const done = letters.filter(pts => {
      let n = 0;
      for (const [px, py] of pts) if (data[((py - y) * w + (px - x)) * 4 + 3] >= 80) n++;
      return n / pts.length >= .95;
    }).length;
    if (done >= Math.ceil(letters.length / 2)) {
      unlocked = true;
      updateSupplyUI();
    }
  }
  function checkSoon() { if (!checkTimer) checkTimer = setTimeout(checkReveal, 250); }

  // Strokes can start on the toast or in the jar and travel between them
  function overPot(e) {
    const r = pot.getBoundingClientRect();
    return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  }
  window.addEventListener('pointerdown', e => {
    if (e.target !== canvas && !pot.contains(e.target)) return;
    e.preventDefault();
    spreading = true;
    activePointer = e.pointerId;
    last = toTex(e);
    if (overPot(e)) refill();
  });
  window.addEventListener('pointermove', e => {
    if (!spreading || e.pointerId !== activePointer) return;
    const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (events.length ? events : [e])) {
      if (overPot(ev)) { if (supply < 1) refill(); last = toTex(ev); }
      else spreadTo(toTex(ev));
    }
  });
  const stop = e => { if (e.pointerId === activePointer) spreading = false; };
  window.addEventListener('pointerup', stop);
  window.addEventListener('pointercancel', stop);
  pot.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); refill(); } });
  canvas.addEventListener('dblclick', () => {
    mctx.clearRect(0, 0, TEX, TEX);
    sctx.clearRect(0, 0, TEX, TEX);
    unlocked = false;
    supply = 1;
    updateSupplyUI();
    maskDirty = smearDirty = dirty = true;
  });
  updateSupplyUI();

  drawText();
  if (document.fonts && document.fonts.load) {
    document.fonts.load('700 100px "Fredoka"').then(() => { drawText(); textDirty = dirty = true; });
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
